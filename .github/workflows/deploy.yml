name: Build and deploy

# On every push to main: run the API tests against PHP, build the React site,
# then publish a ready-to-deploy copy to the "production" branch.
# cPanel (Git Version Control) pulls "production" and copies public/ into the subdomain folder.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite, pdo_mysql, mbstring

      - name: Refresh seed data
        run: npm run seed:json

      - name: API tests (PHP + SQLite)
        run: npm test

      - name: Build website + admin
        run: |
          npm --prefix client install
          npm --prefix client run build

      - name: Prepare production files
        run: |
          mkdir -p out/public
          cp -r dist/. out/public/
          cp -r php/. out/public/
          rm -f out/public/api/config.php
          find out/public/uploads -type f ! -name '.htaccess' ! -name '.gitkeep' -delete
          cp deploy/cpanel.yml out/.cpanel.yml
          cp README.md out/
          printf 'public/api/config.php\npublic/uploads/*\n!public/uploads/.htaccess\n!public/uploads/.gitkeep\n' > out/.gitignore

      - name: Push to production branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir deploy-branch && cd deploy-branch
          git init -q -b production
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin production; then git reset -q --soft FETCH_HEAD; fi
          rsync -a --delete --exclude .git ../out/ ./
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q origin production
